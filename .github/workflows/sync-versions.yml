name: Sync versions

on:
  workflow_dispatch:
  repository_dispatch:
    types: [sync-versions]
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

# releases of several plugins dispatch at once: run one sync at a time
concurrency:
  group: sync-versions
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/sync_versions.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit
        run: |
          git add -A
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync package versions"
          git pull --rebase
          git push
